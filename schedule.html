<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C0A0E">
  <meta name="description" content="The Palace — 3rd Edition beer pong tournament. Friday 12 June 2026, midday, outdoors. Live scoreboard, standings, On Fire leaderboard and Palace Odds.">
  <!-- Social unfurl. TODO: for the most reliable WhatsApp/Twitter preview, change the two URLs below to your absolute GitHub Pages address, e.g. https://YOURNAME.github.io/palace-pong/ -->
  <meta property="og:title" content="The Palace — 3rd Edition">
  <meta property="og:description" content="Beer pong tournament · Friday 12 June 2026 · Midday · Outdoors. Live scoreboard, On Fire leaderboard & Palace Odds.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://YOURNAME.github.io/palace-pong/">
  <meta property="og:image" content="og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Palace — 3rd Edition">
  <meta name="twitter:description" content="Beer pong tournament · Friday 12 June 2026 · Midday · Outdoors.">
  <meta name="twitter:image" content="og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Schedule — The Palace 3rd Edition</title>
  <link rel="icon" type="image/png" href="palace-logo.png">
  <link rel="apple-touch-icon" href="palace-logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<div id="loading-bar"></div>
<div id="error-banner" hidden></div>


<div class="status-bar">
  <button id="refresh-btn" title="Refresh now">↻</button>
  <span id="last-updated">Loading…</span>
</div>

<div class="page-header">
  <h1>Order of Play</h1>
  <div class="subtitle" id="sched-subtitle">Auto-updates every 30 s</div>
</div>

<main>
  <!-- STAY-TUNED placeholder (registration mode) -->
  <div id="reg-placeholder" hidden>
    <div class="stay-tuned">
      <span class="st-icon">📅</span>
      <div class="st-title serif">Fixtures dropping soon</div>
      <div class="st-sub">
        The 3rd Edition order of play will appear here once teams are confirmed.
        <strong>Friday 12 June 2026 · midday · outdoors.</strong>
      </div>
      <a class="poll-cta" href="#" target="_blank" rel="noopener"><span class="poll-icon">💬</span>Vote in Party Chat Poll</a>
    </div>
  </div>

  <!-- LIVE schedule -->
  <div id="live-schedule" hidden>
    <!-- Find my match -->
    <div class="find-match">
      <label class="find-label" for="find-team">Find my match</label>
      <select id="find-team" class="find-select">
        <option value="">Choose your team…</option>
      </select>
      <div class="find-summary" id="find-summary" hidden></div>
    </div>
    <div class="section-divider">Pool Stage</div>
    <div class="card" id="pool-list">
      <p class="text-muted" style="font-size:.85rem">Loading…</p>
    </div>
    <div class="section-divider">Knockout Stage</div>
    <div class="card" id="ko-list">
      <p class="text-muted" style="font-size:.85rem">Loading…</p>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/compute.js"></script>
<script src="js/app.js"></script>
<script>
const FIND_KEY = "palace-find-team";
let findWired = false;

function render(c) {
  document.getElementById("reg-placeholder").hidden = !c.registration;
  document.getElementById("live-schedule").hidden = c.registration;
  wirePollCtas();
  if (c.registration) {
    // Once the draw is in, the poll CTA is moot — point at the teams instead.
    if (c.teamsDrawn) {
      const ph = document.getElementById("reg-placeholder");
      const title = ph.querySelector(".st-title"), sub = ph.querySelector(".st-sub");
      const poll = ph.querySelector(".poll-cta");
      if (title) title.textContent = "Teams are drawn";
      if (sub) sub.innerHTML = `The matchups are set — the order of play lands here once pools are finalised. <strong>${c.tournament.date} · ${c.tournament.startTime}.</strong>`;
      if (poll) poll.hidden = true;
      if (!ph.querySelector(".teams-link")) {
        ph.querySelector(".stay-tuned").insertAdjacentHTML("beforeend",
          `<a class="signup-btn teams-link" href="teams.html">👥 See the teams</a>`);
      }
    }
    return;
  }

  const pool = c.orderOfPlay.filter(m => !m.isKO);
  const ko   = c.orderOfPlay.filter(m => m.isKO);
  document.getElementById("pool-list").innerHTML =
    pool.length ? pool.map(oopMatchRow).join("") : `<p class="text-muted" style="font-size:.85rem">No matches.</p>`;
  document.getElementById("ko-list").innerHTML =
    ko.length ? ko.map(oopMatchRow).join("") : `<p class="text-muted" style="font-size:.85rem">No matches.</p>`;

  setupFind(c);
}

function setupFind(c) {
  const sel = document.getElementById("find-team");
  if (!sel) return;
  // Populate the dropdown once, from the confirmed teams.
  if (!findWired) {
    sel.innerHTML = `<option value="">Choose your team…</option>` +
      TEAMS.map(t => `<option value="${t.id}">${teamLabel(t.id)}</option>`).join("");
    const saved = localStorage.getItem(FIND_KEY) || "";
    if (saved && TEAMS.some(t => t.id === saved)) sel.value = saved;
    sel.addEventListener("change", () => {
      localStorage.setItem(FIND_KEY, sel.value);
      applyFind(appState.computed, true);
    });
    findWired = true;
  }
  applyFind(c, false);
}

function applyFind(c, doScroll) {
  const sel = document.getElementById("find-team");
  const summary = document.getElementById("find-summary");
  const id = sel ? sel.value : "";
  document.querySelectorAll(".match-row.find-hl").forEach(el => el.classList.remove("find-hl"));
  if (!id) { if (summary) summary.hidden = true; return; }

  document.querySelectorAll(`.match-row[data-home="${id}"], .match-row[data-away="${id}"]`)
    .forEach(el => el.classList.add("find-hl"));

  // Next upcoming match for this team
  const mine = c.orderOfPlay.filter(m => m.homeId === id || m.awayId === id);
  const nextUp = mine.find(m => m.status === "upcoming") || mine.find(m => m.status === "live");
  if (summary) {
    if (nextUp) {
      const oppId = nextUp.homeId === id ? nextUp.awayId : nextUp.homeId;
      const opp = oppId ? teamLabel(oppId) : "TBD";
      const verb = nextUp.status === "live" ? "You're up NOW" : `You're up at ${nextUp.start}`;
      summary.hidden = false;
      summary.innerHTML = `${verb} — match #${nextUp.slot} vs <strong>${opp}</strong>`;
    } else {
      summary.hidden = false;
      summary.innerHTML = `No upcoming matches — ${teamLabel(id)} is done for the day.`;
    }
  }
  if (doScroll && nextUp) {
    const row = document.querySelector(`.match-row[data-slot="${nextUp.slot}"]`);
    if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

initPage(render);
</script>
</body>
</html>
