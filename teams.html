<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C0A0E">
  <title>Teams — The Palace 3rd Edition</title>
  <link rel="icon" type="image/png" href="palace-logo.png">
  <link rel="apple-touch-icon" href="palace-logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="bottom-nav">
  <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
  <a href="schedule.html"><span class="nav-icon">📅</span>Schedule</a>
  <a href="standings.html"><span class="nav-icon">🏆</span>Standings</a>
  <a href="onfire.html"><span class="nav-icon">🔥</span>On Fire</a>
  <a href="rules.html"><span class="nav-icon">📜</span>Rules</a>
  <a href="teams.html"><span class="nav-icon">👥</span>Teams</a>
  <a href="halloffame.html"><span class="nav-icon">👑</span>Hall of Fame</a>
</nav>

<div class="page-header">
  <h1>Teams</h1>
  <div class="subtitle" id="teams-subtitle">3rd Edition · rosters to be confirmed</div>
</div>

<main>

  <!-- REGISTRATION: TBD rosters + sign up -->
  <div id="reg-teams" hidden>
    <div class="stay-tuned" style="margin-bottom:1rem">
      <span class="st-icon">👥</span>
      <div class="st-title serif">Rosters to be determined</div>
      <div class="st-sub">Grab a partner and claim one of the slots below. Confirmed teams appear here as they sign up.</div>
      <div class="poll-cta"><span class="poll-icon">💬</span>Vote in Party Chat Poll</div>
    </div>
    <div class="section-divider">Open Slots</div>
    <div class="team-grid" id="tbd-teams"></div>
  </div>

  <!-- LIVE teams -->
  <div id="live-teams" hidden>
    <div class="section-divider">Pool A</div>
    <div class="team-grid" id="pool-a-teams"></div>
    <div class="section-divider" style="margin-top:1.25rem">Pool B</div>
    <div class="team-grid" id="pool-b-teams"></div>
  </div>

</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
function renderPool(pool, containerId) {
  const teams = poolTeams(pool);
  document.getElementById(containerId).innerHTML = teams.map(t => `
    <div class="team-card">
      <div class="pool-tag">Pool ${t.pool}</div>
      <div class="players">
        ${t.players.map(p => `<div class="player-row">${playerIcon(p)} ${p}</div>`).join("")}
      </div>
    </div>`).join("");
}

function renderTbd(containerId, count) {
  let html = "";
  for (let i = 1; i <= count; i++) {
    html += `
      <div class="team-card">
        <div class="pool-tag">Team ${i}</div>
        <div class="players">
          <div class="player-row" style="color:var(--text-dim)">👤 TBD</div>
          <div class="player-row" style="color:var(--text-dim)">👤 TBD</div>
        </div>
      </div>`;
  }
  document.getElementById(containerId).innerHTML = html;
}

function playerIcon(player) {
  if (player === "Lalaina" || player === "Zackary") return "👑";
  if (player === "Paolo") return "🔥";
  return "👤";
}

document.getElementById("reg-teams").hidden = !REGISTRATION_MODE;
document.getElementById("live-teams").hidden = REGISTRATION_MODE;
const signup = document.getElementById("signup-link");
if (signup) signup.href = whatsappUrl("Hi Sayor — I'd like to sign up for The Palace 3rd Edition (Fri 12 June). My team:");

if (REGISTRATION_MODE) {
  renderTbd("tbd-teams", 10);
} else {
  renderPool("A", "pool-a-teams");
  renderPool("B", "pool-b-teams");
}
</script>
</body>
</html>
