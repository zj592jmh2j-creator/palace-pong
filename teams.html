<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C0A0E">
  <meta name="description" content="The Palace — 3rd Edition beer pong tournament. Friday 12 June 2026, midday, outdoors. Live scoreboard, standings, On Fire leaderboard and Palace Odds.">
  <!-- Social unfurl. TODO: for the most reliable WhatsApp/Twitter preview, change the two URLs below to your absolute GitHub Pages address, e.g. https://YOURNAME.github.io/palace-pong/ -->
  <meta property="og:title" content="The Palace — 3rd Edition">
  <meta property="og:description" content="Beer pong tournament · Friday 12 June 2026 · Midday · Outdoors. Live scoreboard, On Fire leaderboard & Palace Odds.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://YOURNAME.github.io/palace-pong/">
  <meta property="og:image" content="og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Palace — 3rd Edition">
  <meta name="twitter:description" content="Beer pong tournament · Friday 12 June 2026 · Midday · Outdoors.">
  <meta name="twitter:image" content="og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Teams — The Palace 3rd Edition</title>
  <link rel="icon" type="image/png" href="palace-logo.png">
  <link rel="apple-touch-icon" href="palace-logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<div id="loading-bar"></div>
<div id="error-banner" hidden></div>

<div class="status-bar">
  <button id="refresh-btn" title="Refresh now">↻</button>
  <span id="last-updated">Loading…</span>
</div>

<div class="page-header">
  <h1>Teams</h1>
  <div class="subtitle" id="teams-subtitle">3rd Edition · rosters to be confirmed</div>
</div>

<main>

  <!-- REGISTRATION: TBD rosters + sign up -->
  <div id="reg-teams" hidden>
    <div class="stay-tuned" style="margin-bottom:1rem">
      <span class="st-icon">👥</span>
      <div class="st-title serif">Rosters to be determined</div>
      <div class="st-sub">Sign up as a <strong>solo competitor</strong> — teams are drawn at random once the field is full.</div>
      <a class="poll-cta" href="#" target="_blank" rel="noopener"><span class="poll-icon">💬</span>Vote in Party Chat Poll</a>
    </div>
    <div class="section-divider" id="tbd-label">The Field</div>
    <div class="team-grid" id="tbd-teams"></div>
  </div>

  <!-- DRAWN teams (from the Sheet's Teams tab) — pooled when pools are set,
       otherwise a single grid while the draw stands but pools are still TBD. -->
  <div id="live-teams" hidden></div>

</main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/compute.js"></script>
<script src="js/app.js"></script>
<script>
// Team photo with graceful fallback. Drop a file at teams/<team-id>.jpg
// (e.g. teams/omar-toni.jpg) or set a `photo` path on the team in config.js.
// If no image is found, a gold monogram placeholder shows instead.
function teamPhoto(t) {
  const src = t.photo || `teams/${t.id}.jpg`;
  const initials = t.players.map(p => p.charAt(0).toUpperCase()).join("");
  return `<div class="team-photo">
    <span class="team-photo-fallback">${initials}</span>
    <img src="${src}" alt="${t.players.join(" & ")}" loading="lazy"
         onerror="this.closest('.team-photo').classList.add('noimg'); this.remove();">
  </div>`;
}

function teamCardHTML(t) {
  return `<div class="team-card">
    ${teamPhoto(t)}
    ${t.pool ? `<div class="pool-tag">Pool ${t.pool}</div>` : ""}
    <div class="players">
      ${t.players.map(p => `<div class="player-row">${playerIcon(p)} ${p}</div>`).join("")}
    </div>
  </div>`;
}

function teamGrid(teams) {
  return `<div class="team-grid">${teams.map(teamCardHTML).join("")}</div>`;
}

// Render the drawn teams. Group by pool when pools are assigned; otherwise show
// one grid (the draw is set, pools come later with the schedule).
function renderTeams(teams) {
  const a = teams.filter(t => t.pool === "A");
  const b = teams.filter(t => t.pool === "B");
  const un = teams.filter(t => !t.pool);
  let html = "";
  if (a.length || b.length) {
    if (a.length) html += `<div class="section-divider">Pool A</div>${teamGrid(a)}`;
    if (b.length) html += `<div class="section-divider" style="margin-top:1.25rem">Pool B</div>${teamGrid(b)}`;
    if (un.length) html += `<div class="section-divider" style="margin-top:1.25rem">Awaiting pool</div>${teamGrid(un)}`;
  } else {
    html = `<div class="section-divider">The Teams · ${teams.length}</div>${teamGrid(teams)}`;
  }
  document.getElementById("live-teams").innerHTML = html;
}

// Registration: list confirmed individual competitors, then fill the remaining
// slots up to spotsTotal with open placeholders.
function renderRegistrationTeams(containerId, signups, spotsTotal) {
  let html = "";
  signups.forEach((s, i) => {
    html += `
      <div class="team-card">
        <div class="pool-tag">#${i + 1} · Confirmed ✓</div>
        <div class="players">👤 ${s.player}</div>
      </div>`;
  });
  for (let i = signups.length; i < spotsTotal; i++) {
    html += `
      <div class="team-card">
        <div class="pool-tag">#${i + 1}</div>
        <div class="players" style="color:var(--text-dim)">👤 Open spot</div>
      </div>`;
  }
  document.getElementById(containerId).innerHTML = html;
  const label = document.getElementById("tbd-label");
  if (label) label.textContent = `The Field · ${signups.length} of ${spotsTotal} in`;
}

function playerIcon(player) {
  if (player === "Lalaina" || player === "Zackary") return "👑";
  if (player === "Paolo") return "🔥";
  return "👤";
}

function render(c) {
  const hasTeams = c.teams && c.teams.length > 0;
  const reg = document.getElementById("reg-teams");
  const live = document.getElementById("live-teams");
  wirePollCtas();

  // Once the draw is in the Sheet, show the teams (with photos) in every phase.
  // Until then, keep the registration "sign up solo / field" view.
  if (hasTeams) {
    reg.hidden = true; live.hidden = false;
    renderTeams(c.teams);
    setText("teams-subtitle", `3rd Edition · ${c.teams.length} teams drawn`);
  } else {
    reg.hidden = !c.registration; live.hidden = c.registration;
    if (c.registration) {
      renderRegistrationTeams("tbd-teams", c.signups, c.tournament.spotsTotal);
    } else {
      renderTeams([]); // nothing to show; live view stays empty
    }
  }
}

initPage(render);
</script>
</body>
</html>
