<body>

<div id="loading-bar"></div>
<div id="error-banner" hidden></div>


<div class="status-bar">
  <button id="refresh-btn" title="Refresh now">↻</button>
  <span id="last-updated">Loading…</span>
</div>

<div class="page-header">
  <h1>🎲 Palace Odds</h1>
  <div class="subtitle" id="odds-state">The House: Sayor · pari-mutuel pools</div>
</div>

<main>
  <div id="odds-markets"><p class="text-muted" style="font-size:.85rem">Loading…</p></div>

  <div class="odds-disclaimer" id="odds-disclaimer"></div>
</main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/compute.js"></script>
<script src="js/app.js"></script>
<script>
const UNIT = 5; // encourage uniform $5 stakes

function money(n) { return "$" + (Math.round(n * 100) / 100).toLocaleString(); }

function backHref(selection, marketLabel) {
  return whatsappUrl(`Hi my Bookie Babe, I'd like to back ${selection} for ${marketLabel}. Stake: ____ (units of $${UNIT})`);
}

// One selection line, styled to match the home "odds board". Backed rows show a
// pool-share bar, the live multiplier and a "$5 returns ~$X" payout preview;
// unbacked rows are recessed with a ghost "Back this" button.
function selectionRow(r, market, isFav, open, rank, maxPct) {
  const backBtn = open
    ? `<a class="odds-back${r.pool > 0 ? "" : " ghost"}" href="${backHref(r.selection, market.label)}" target="_blank" rel="noopener">Back this</a>`
    : "";

  // Unbacked → compact one-liner (10–20 of these shouldn't dominate the page).
  if (r.pool <= 0) {
    return `<div class="odds-line bet noback">
      <div class="odds-line-name">${r.selection}</div>
      ${open ? backBtn : `<span class="odds-noback">no backers yet</span>`}
    </div>`;
  }

  const dec = r.decimal;
  const ret = Math.round(UNIT * dec);
  const w = maxPct > 0 ? Math.max(8, Math.round((r.impliedPct / maxPct) * 100)) : 0;
  const tag = isFav ? `<span class="odds-line-tag">Favourite</span>`
            : (r.backers === 1 ? `<span class="odds-line-tag muted">Only backer</span>` : "");
  return `<div class="odds-line bet${isFav ? " fav" : ""}">
    <span class="odds-line-rank">${rank}</span>
    <div class="odds-line-main">
      <div class="odds-line-top">
        <div class="odds-line-name">${isFav ? `<span class="odds-line-crown">★</span>` : ""}${r.selection}${tag}</div>
        <span class="odds-line-dec">${dec.toFixed(1)}<small>×</small></span>
      </div>
      <div class="odds-line-bar"><span style="width:${w}%"></span></div>
      <div class="odds-line-foot">
        <span class="odds-line-return">$${UNIT} returns <strong>~$${ret}</strong> · ${Math.round(r.impliedPct * 100)}% chance</span>
        ${backBtn}
      </div>
    </div>
  </div>`;
}

function settlementPanel(m) {
  const s = m.settlement;
  if (!s) return "";
  const title = s.winners.join(" & ");
  if (s.refunded) {
    return `<div class="odds-results">
      <div class="odds-results-title">Result: ${title}</div>
      <p>No backers on the winner — <strong>all stakes in this market are refunded.</strong></p>
    </div>`;
  }
  const list = s.winningBets
    .map(b => `<li>${b.bettor || "Anon"} — ${money(b.stake)} on ${b.selection} → returns <strong>${money(b.return)}</strong></li>`).join("");
  return `<div class="odds-results">
    <div class="odds-results-title">🏆 Result: ${title}</div>
    <p>Final pool ${money(m.totalPool)} · winners split at <strong>${s.payout.toFixed(2)}x</strong></p>
    <ul class="odds-winners">${list || "<li>No bets on the winner.</li>"}</ul>
  </div>`;
}

function marketCard(c, market) {
  const m = c.odds[market.key];
  // A market only "settles" once betting has closed — while betting is open we
  // always show live odds (guards against leftover bracket data settling early).
  const settled = !!m.settlement && !c.betting.open;
  const open = c.betting.open;   // betting is open from registration until lock

  const status = settled
    ? `<span class="odds-card-status closed">Settled</span>`
    : (open
        ? `<span class="odds-card-status open"><span class="odds-status-dot"></span>Betting open</span>`
        : `<span class="odds-card-status closed">Betting closed</span>`);
  const note = settled ? ""
    : (open
        ? `<p class="odds-card-tagline">Odds float with the pool and lock at the start of the tournament (12:00, midday). Your payout is set by the final pool.</p>`
        : `<p class="odds-card-tagline">Betting is closed — these odds are final.</p>`);

  const unit = market.source === "teams" ? "team" : "competitor";
  const firstNote = (m.totalPool === 0 && open)
    ? `<div class="odds-empty"><span class="odds-empty-ico">🎯</span><span>No bets yet — back a ${unit} to set the opening line.</span></div>` : "";

  // Bars scale to the favourite (longest), matching the home card.
  const backed = m.rows.filter(r => r.pool > 0);
  const maxPct = backed.length ? Math.max(...backed.map(r => r.impliedPct)) : 1;
  // Always list every selection so a bet can be placed; rank only the backed ones.
  let rank = 0;
  const rows = m.rows.map(r => {
    const isBacked = r.pool > 0;
    if (isBacked) rank++;
    return selectionRow(r, market, r.selection === m.favourite, open, isBacked ? rank : null, maxPct);
  }).join("");

  const poolFoot = `<div class="odds-card-foot">
    <div class="odds-stat"><span class="odds-stat-num">${money(m.totalPool)}</span><span class="odds-stat-lbl">in the pool</span></div>
    <div class="odds-stat-div"></div>
    <div class="odds-stat"><span class="odds-stat-num">${m.betCount}</span><span class="odds-stat-lbl">bet${m.betCount !== 1 ? "s" : ""} placed</span></div>
  </div>`;

  return `<div class="card odds-card">
    <div class="odds-card-head">
      <div class="card-title" style="margin-bottom:0"><span class="icon">${market.key === "onfire" ? "🔥" : "🏆"}</span>${market.label}</div>
      ${status}
    </div>
    ${note}${settled ? settlementPanel(m) : ""}${firstNote}
    <div class="odds-board">${rows}</div>
    ${poolFoot}
  </div>`;
}

function render(c) {
  const st = document.getElementById("odds-state");
  st.textContent = c.betting.open ? "Betting OPEN · locks at midday" : "Betting closed · odds final";

  document.getElementById("odds-markets").innerHTML = MARKETS.map(mk => marketCard(c, mk)).join("");

  const note = c.tournament.oddsNote ? ` ${c.tournament.oddsNote}` : "";
  document.getElementById("odds-disclaimer").innerHTML =
    `<strong>The House is Sayor.</strong> The Palace is a friends' game. <strong>Tournament Winner</strong> is bet on a <strong>team</strong> — back the pair you fancy and if they win the Final, you cash. <strong>On Fire</strong> is bet on an <strong>individual competitor</strong> — the single hottest player. Both are pari-mutuel pools: the pot is split in proportion to stake among backers of the winning side. Odds float until betting locks; your payout is set by the final pool. The House settles in person. If nobody backed the winner, all stakes are refunded. Keep stakes to $${UNIT} units so the pool stays sane.${note}`;
}

initPage(render);
</script>
</body>
</html>
